name: Daily RSS update

on:
  schedule:
    # 06:23 UTC; not at the start of the hour to reduce queue delays.
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-rss-update
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Отримати репозиторій
        uses: actions/checkout@v4

      - name: Налаштувати Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Оновити добірку з RSS
        run: python scripts/update_feed.py

      - name: Зберегти нові матеріали
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/articles.json
          if git diff --cached --quiet; then
            echo "Нових матеріалів немає. Коміт не потрібен."
          else
            git commit -m "content: update curated RSS feed"
            git push
          fi
