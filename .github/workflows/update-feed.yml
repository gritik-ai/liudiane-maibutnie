name: Daily RSS update

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - "articles/**"
      - "content/articles.json"
      - "content/source_stats.json"
      - "sitemap.xml"
      - "robots.txt"
  schedule:
    # 06:23 UTC; not at the start of the hour to reduce queue delays.
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      test_only:
        description: "Запустити лише автоматичні тести без оновлення RSS-бібліотеки"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rss-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Перевірка коду та редакційного фільтра
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Отримати репозиторій
        uses: actions/checkout@v7

      - name: Налаштувати Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Виконати автоматичні тести
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Згенерувати SEO-сторінки та sitemap у робочій копії
        run: python scripts/build_site.py --write

      - name: Перевірити SEO-сторінки та sitemap
        run: python scripts/build_site.py --check

  update-feed:
    name: Оновлення RSS-бібліотеки
    if: github.event_name != 'pull_request' && inputs.test_only != true
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Отримати репозиторій
        uses: actions/checkout@v7

      - name: Налаштувати Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Оновити добірку та статистику джерел
        run: python scripts/update_feed.py

      - name: Перегенерувати сторінки статей та sitemap
        run: python scripts/build_site.py --write

      - name: Зберегти бібліотеку та звіт джерел
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/articles.json content/source_stats.json articles/ topics/ sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "Бібліотека та статистика джерел без змін. Коміт не потрібен."
          else
            git commit -m "content: update curated feed and source statistics"
            git push
          fi
